<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#7654e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boxing Memory">

<title>Boxing Memory — ذاكرتي للكيك بوكسينغ</title>

<link rel="manifest" href="./manifest.json">

<link
  rel="apple-touch-icon"
  href="./AED5A342-A9AB-4969-88BA-3C9E7AF7949F.png"
>

<link
  rel="icon"
  type="image/png"
  href="./AED5A342-A9AB-4969-88BA-3C9E7AF7949F.png"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root {
    --purple: #7654e8;
    --purple-dark: #5338b8;
    --purple-light: #eeeaff;
    --lavender: #f7f5ff;
    --pink: #ff78a8;
    --green: #28a96b;
    --green-light: #e8f8ef;
    --yellow: #f3b83f;
    --yellow-light: #fff6dc;
    --red: #e85d68;
    --red-light: #ffecef;
    --blue: #4e8ee8;
    --blue-light: #eaf2ff;
    --text: #24222d;
    --muted: #777383;
    --border: #e8e4f2;
    --white: #ffffff;
    --shadow: 0 10px 35px rgba(73, 50, 130, 0.09);
    --radius: 22px;
    --radius-small: 14px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at top right,
            rgba(118,84,232,0.08),
            transparent 32%
        ),
        var(--lavender);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   HEADER
========================================================= */

.app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(247,245,255,0.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(118,84,232,0.08);
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.brand-icon {
    width: 46px;
    height: 46px;
    border-radius: 15px;
    object-fit: cover;
    box-shadow: 0 6px 20px rgba(118,84,232,0.18);
}

.brand-text h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 900;
}

.brand-text p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--muted);
}

.header-action {
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--white);
    box-shadow: var(--shadow);
    color: var(--purple);
    font-size: 19px;
}

/* =========================================================
   MAIN
========================================================= */

main {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-title {
    margin: 10px 0 5px;
    font-size: 25px;
    font-weight: 950;
}

.section-subtitle {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    background:
        linear-gradient(
            135deg,
            rgba(118,84,232,0.98),
            rgba(151,116,241,0.96)
        );
    color: white;
    border-radius: 30px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(89,62,180,0.22);
    overflow: hidden;
    position: relative;
    margin-bottom: 18px;
}

.hero::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    left: -50px;
    bottom: -80px;
}

.hero::before {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    right: -25px;
    top: -40px;
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero h2 {
    margin: 0 0 8px;
    font-size: 27px;
    font-weight: 950;
}

.hero p {
    margin: 0;
    line-height: 1.8;
    opacity: 0.92;
    font-size: 13px;
}

.hero-stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
    margin-top: 18px;
}

.hero-stat {
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 17px;
    padding: 12px 8px;
    text-align: center;
}

.hero-stat strong {
    display: block;
    font-size: 22px;
}

.hero-stat span {
    font-size: 10px;
    opacity: .85;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: none;
    border-radius: 15px;
    padding: 11px 16px;
    font-weight: 800;
    transition: transform .15s ease, box-shadow .15s ease;
}

.btn:active {
    transform: scale(.96);
}

.btn-primary {
    background: var(--purple);
    color: white;
    box-shadow: 0 7px 18px rgba(118,84,232,.2);
}

.btn-secondary {
    background: var(--purple-light);
    color: var(--purple-dark);
}

.btn-white {
    background: white;
    color: var(--purple-dark);
}

.btn-danger {
    background: var(--red-light);
    color: #b92e3d;
}

.btn-success {
    background: var(--green-light);
    color: #16804d;
}

.btn-small {
    padding: 8px 11px;
    border-radius: 11px;
    font-size: 12px;
}

/* =========================================================
   DASHBOARD GRID
========================================================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.dashboard-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 17px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .18s ease;
}

.dashboard-card:active {
    transform: scale(.98);
}

.dashboard-card .icon {
    width: 44px;
    height: 44px;
    border-radius: 15px;
    background: var(--purple-light);
    display: grid;
    place-items: center;
    font-size: 22px;
    margin-bottom: 12px;
}

.dashboard-card h3 {
    margin: 0 0 5px;
    font-size: 14px;
}

.dashboard-card p {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
}

.search-box input {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    border-radius: 15px;
    padding: 12px 42px 12px 13px;
    outline: none;
}

.search-box span {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.select-control {
    border: 1px solid var(--border);
    background: white;
    border-radius: 15px;
    padding: 0 13px;
    outline: none;
    color: var(--text);
}

/* =========================================================
   CATEGORY CHIPS
========================================================= */

.chips {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 15px;
    scrollbar-width: none;
}

.chips::-webkit-scrollbar {
    display: none;
}

.chip {
    white-space: nowrap;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    border-radius: 30px;
    padding: 8px 13px;
    font-size: 11px;
    font-weight: 750;
}

.chip.active {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
}

/* =========================================================
   MOVEMENT GRID
========================================================= */

.moves-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px;
}

.move-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .18s ease;
}

.move-card:active {
    transform: scale(.985);
}

.move-visual {
    background: #f5f0e6;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.move-level {
    position: absolute;
    top: 9px;
    right: 9px;
    background: rgba(255,255,255,.92);
    border-radius: 10px;
    padding: 5px 8px;
    font-size: 9px;
    font-weight: 900;
    color: var(--purple-dark);
}

.move-info {
    padding: 13px;
}

.move-info h3 {
    font-size: 14px;
    margin: 0 0 4px;
}

.move-info .english {
    direction: ltr;
    text-align: left;
    color: var(--purple);
    font-weight: 850;
    font-size: 11px;
    margin-bottom: 6px;
}

.move-info p {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
    margin: 0 0 10px;
}

.move-actions {
    display: flex;
    gap: 6px;
}

.move-actions button {
    flex: 1;
    border: none;
    border-radius: 11px;
    padding: 8px 4px;
    font-size: 10px;
    font-weight: 800;
}

/* =========================================================
   SVG CHARACTER — NEW RETRO BOXING STYLE
========================================================= */

.fighter-svg {
    width: 100%;
    max-width: 220px;
    height: 170px;
    overflow: visible;
}

/* Red fighter (user) */
.fighter-svg .red-skin {
    fill: #f1c8a9;
    stroke: #3b304e;
    stroke-width: 2.5;
}

.fighter-svg .red-hair {
    fill: #30253b;
    stroke: #3b304e;
    stroke-width: 1.5;
}

.fighter-svg .red-short {
    fill: #c0392b;
    stroke: #3b304e;
    stroke-width: 2.5;
}

.fighter-svg .red-arm {
    stroke: #3b304e;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.fighter-svg .red-leg {
    stroke: #3b304e;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.fighter-svg .red-glove {
    fill: #d4453a;
    stroke: #3b304e;
    stroke-width: 2;
}

.fighter-svg .red-shoe {
    fill: #3b304e;
    stroke: #3b304e;
    stroke-width: 1.5;
}

/* Blue fighter (opponent) */
.fighter-svg .blue-skin {
    fill: #f1c8a9;
    stroke: #3b304e;
    stroke-width: 2.5;
}

.fighter-svg .blue-hair {
    fill: #30253b;
    stroke: #3b304e;
    stroke-width: 1.5;
}

.fighter-svg .blue-short {
    fill: #2c5f8a;
    stroke: #3b304e;
    stroke-width: 2.5;
}

.fighter-svg .blue-arm {
    stroke: #3b304e;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.fighter-svg .blue-leg {
    stroke: #3b304e;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.fighter-svg .blue-glove {
    fill: #3a6b8f;
    stroke: #3b304e;
    stroke-width: 2;
}

.fighter-svg .blue-shoe {
    fill: #3b304e;
    stroke: #3b304e;
    stroke-width: 1.5;
}

/* Motion / impact lines */
.fighter-svg .motion-line {
    stroke: #3b304e;
    stroke-width: 2;
    stroke-linecap: round;
    fill: none;
    opacity: 0.7;
}

.fighter-svg .impact-star {
    fill: #f3b83f;
    stroke: #3b304e;
    stroke-width: 1.5;
}

.fighter-svg .impact-line {
    stroke: #f3b83f;
    stroke-width: 2.5;
    stroke-linecap: round;
}

.fighter-svg .arrow {
    stroke: #c0392b;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 7 5;
}

.fighter-svg .target {
    fill: rgba(243,184,63,.15);
    stroke: #f3b83f;
    stroke-width: 2;
    stroke-dasharray: 4 4;
}

.fighter-svg .pivot {
    fill: none;
    stroke: #4e8ee8;
    stroke-width: 2.5;
    stroke-dasharray: 5 4;
}

.fighter-svg .animated-part {
    transform-box: fill-box;
    transform-origin: center;
}

/* =========================================================
   MOVE DETAIL MODAL
========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26,20,43,.58);
    z-index: 500;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
}

.modal-backdrop.open {
    display: flex;
}

.modal {
    width: min(760px,100%);
    max-height: 94vh;
    overflow-y: auto;
    background: white;
    border-radius: 30px 30px 0 0;
    padding: 18px;
    animation: modalIn .22s ease;
}

@keyframes modalIn {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.modal-head h2 {
    margin: 0;
    font-size: 20px;
}

.close-btn {
    border: none;
    background: var(--purple-light);
    color: var(--purple);
    width: 38px;
    height: 38px;
    border-radius: 13px;
    font-size: 20px;
}

.modal-visual {
    background: #f5f0e6;
    border-radius: 24px;
    min-height: 280px;
    display: grid;
    place-items: center;
    margin: 10px 0 15px;
}

.modal-visual .fighter-svg {
    max-width: 340px;
    height: 260px;
}

.detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 12px;
}

.meta-pill {
    background: var(--purple-light);
    color: var(--purple-dark);
    border-radius: 20px;
    padding: 7px 10px;
    font-size: 10px;
    font-weight: 800;
}

.detail-description {
    color: #56515f;
    font-size: 13px;
    line-height: 1.9;
    background: #faf9fd;
    border-radius: 16px;
    padding: 13px;
}

.modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 13px;
}

/* =========================================================
   ANIMATION CONTROLS
========================================================= */

.animation-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 15px;
}

.animation-display {
    background: #f5f0e6;
    border-radius: 20px;
    min-height: 300px;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
}

.animation-display .fighter-svg {
    max-width: 360px;
    height: 290px;
}

.animation-label {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
}

.animation-label span {
    background: rgba(255,255,255,.92);
    padding: 7px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 850;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.speed-controls {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

.speed-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    padding: 9px 5px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
}

.speed-btn.active {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
}

/* =========================================================
   SERIES BUILDER
========================================================= */

.series-builder {
    background: white;
    border: 1px solid var(--border);
    border-radius: 23px;
    padding: 15px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
}

.series-builder h3 {
    margin: 0 0 5px;
}

.series-builder p {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 11px;
}

.series-strip {
    min-height: 125px;
    border: 2px dashed #dcd5f5;
    background: #faf9ff;
    border-radius: 17px;
    padding: 10px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    align-items: center;
}

.series-empty {
    min-width: 100%;
    text-align: center;
    color: #aaa4b5;
    font-size: 11px;
}

.series-mini-card {
    min-width: 110px;
    width: 110px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
    position: relative;
}

.series-mini-card .mini-visual {
    height: 82px;
    background: #f5f0e6;
    display: grid;
    place-items: center;
}

.series-mini-card .mini-visual .fighter-svg {
    width: 100px;
    height: 78px;
}

.series-mini-card .mini-name {
    padding: 7px;
    font-size: 9px;
    font-weight: 850;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.remove-mini {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 23px;
    height: 23px;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,.95);
    color: var(--red);
    font-weight: 900;
}

.series-tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.series-speed {
    display: flex;
    gap: 5px;
    margin-top: 9px;
}

.series-speed button {
    flex: 1;
    border: 1px solid var(--border);
    background: white;
    border-radius: 10px;
    padding: 7px 2px;
    font-size: 10px;
}

.series-speed button.active {
    background: var(--purple);
    color: white;
}

/* =========================================================
   SAVED SERIES
========================================================= */

.saved-series {
    display: grid;
    gap: 12px;
}

.saved-series-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 21px;
    padding: 14px;
    box-shadow: var(--shadow);
}

.saved-series-header {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
}

.saved-series-header h3 {
    margin: 0;
    font-size: 14px;
}

.saved-series-header small {
    color: var(--muted);
    font-size: 9px;
}

.saved-series-visuals {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding: 10px 0;
}

.saved-mini {
    min-width: 75px;
    width: 75px;
    height: 65px;
    border-radius: 11px;
    background: #f5f0e6;
    overflow: hidden;
    display: grid;
    place-items: center;
}

.saved-mini .fighter-svg {
    width: 70px;
    height: 60px;
}

.saved-series-actions {
    display: flex;
    gap: 6px;
}

/* =========================================================
   DICTIONARY
========================================================= */

.dictionary-list {
    display: grid;
    gap: 9px;
}

.dictionary-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
}

.dictionary-main strong {
    display: block;
    font-size: 13px;
}

.dictionary-main .standard {
    direction: ltr;
    text-align: left;
    color: var(--purple);
    font-size: 11px;
    font-weight: 850;
    margin-top: 3px;
}

.dictionary-main small {
    display: block;
    color: var(--muted);
    font-size: 9px;
    margin-top: 3px;
}

.dictionary-edit {
    border: none;
    background: var(--purple-light);
    color: var(--purple-dark);
    border-radius: 11px;
    padding: 8px 10px;
    font-size: 10px;
    font-weight: 800;
}

/* =========================================================
   TRACKING
========================================================= */

.tracking-list {
    display: grid;
    gap: 12px;
}

.tracking-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 21px;
    padding: 14px;
    box-shadow: var(--shadow);
}

.tracking-card h3 {
    margin: 0 0 8px;
    font-size: 14px;
}

.rating-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 6px;
}

.rating-item {
    background: #faf9fd;
    border-radius: 12px;
    padding: 8px 4px;
    text-align: center;
}

.rating-item span {
    display: block;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 4px;
}

.rating-value {
    font-size: 15px;
}

/* =========================================================
   CLASSES
========================================================= */

.schedule-list {
    display: grid;
    gap: 10px;
}

.class-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px;
    box-shadow: var(--shadow);
}

.class-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.day-name {
    font-size: 16px;
    font-weight: 950;
}

.class-time {
    color: var(--purple);
    font-weight: 800;
    font-size: 11px;
}

.attendance-btn {
    border: none;
    border-radius: 12px;
    padding: 8px 11px;
    font-size: 10px;
    font-weight: 900;
}

.attendance-btn.present {
    background: var(--green-light);
    color: var(--green);
}

.attendance-btn.absent {
    background: var(--red-light);
    color: var(--red);
}

.class-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 11px;
}

.class-stat {
    background: #faf9fd;
    border-radius: 12px;
    padding: 9px;
}

.class-stat small {
    display: block;
    color: var(--muted);
    font-size: 9px;
}

.class-stat strong {
    font-size: 15px;
}

/* =========================================================
   PAYMENT
========================================================= */

.payment-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 15px;
    box-shadow: var(--shadow);
    margin-top: 15px;
}

.payment-box h3 {
    margin: 0 0 5px;
}

.payment-box p {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

.payment-list {
    display: grid;
    gap: 8px;
}

.payment-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: #faf9fd;
    border-radius: 13px;
    padding: 10px;
}

.payment-row strong {
    font-size: 11px;
}

.payment-row span {
    font-size: 10px;
}

.payment-toggle {
    border: none;
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 9px;
    font-weight: 850;
}

.payment-toggle.paid {
    background: var(--green-light);
    color: var(--green);
}

.payment-toggle.unpaid {
    background: var(--red-light);
    color: var(--red);
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 200;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding:
        7px
        max(7px, env(safe-area-inset-right))
        calc(7px + env(safe-area-inset-bottom))
        max(7px, env(safe-area-inset-left));
}

.nav-inner {
    max-width: 760px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 4px;
}

.nav-btn {
    border: none;
    background: transparent;
    color: #8d8797;
    border-radius: 14px;
    padding: 7px 2px;
    font-size: 9px;
    font-weight: 750;
}

.nav-btn .nav-icon {
    display: block;
    font-size: 20px;
    line-height: 22px;
    margin-bottom: 2px;
}

.nav-btn.active {
    color: var(--purple);
    background: var(--purple-light);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%) translateY(20px);
    background: #282334;
    color: white;
    padding: 11px 16px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 750;
    opacity: 0;
    pointer-events: none;
    transition: .25s ease;
    z-index: 1000;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
    background: white;
    border: 1px dashed #d9d3e8;
    border-radius: 20px;
    padding: 35px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-state .empty-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.empty-state h3 {
    margin: 0 0 5px;
    color: var(--text);
    font-size: 15px;
}

.empty-state p {
    margin: 0;
    font-size: 11px;
    line-height: 1.7;
}

/* =========================================================
   FORMS
========================================================= */

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 10px;
    font-weight: 850;
    margin-bottom: 6px;
}

.form-control {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    border-radius: 13px;
    padding: 10px 11px;
    outline: none;
}

.form-control:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(118,84,232,.09);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (min-width: 650px) {

    .moves-grid {
        grid-template-columns: repeat(3,minmax(0,1fr));
    }

    .dashboard-grid {
        grid-template-columns: repeat(4,1fr);
    }

    .modal-backdrop {
        align-items: center;
        padding: 20px;
    }

    .modal {
        border-radius: 30px;
        max-height: 90vh;
    }
}

@media (min-width: 1000px) {

    main {
        padding: 25px;
    }

    .moves-grid {
        grid-template-columns: repeat(4,minmax(0,1fr));
    }

    .hero {
        padding: 35px;
    }
}

/* =========================================================
   REAL MOVEMENT ANIMATION
========================================================= */

@keyframes punchForward {
    0%,100% {
        transform: translateX(0) rotate(0deg);
    }

    45% {
        transform: translateX(22px) rotate(-3deg);
    }

    60% {
        transform: translateX(25px) rotate(-4deg);
    }
}

@keyframes punchBack {
    0%,100% {
        transform: translateX(0);
    }

    45% {
        transform: translateX(-22px);
    }

    60% {
        transform: translateX(-25px);
    }
}

@keyframes kickForward {
    0%,100% {
        transform: rotate(0deg);
    }
