/* =========================================================
   GLOBAL
========================================================= */

:root {
    --purple: #7654e8;
    --purple-dark: #5338b8;
    --purple-light: #eeeaff;
    --lavender: #f7f5ff;
    --pink: #ff78a8;
    --green: #28a96b;
    --green-light: #e8f8ef;
    --yellow: #f3b83f;
    --yellow-light: #fff6dc;
    --red: #e85d68;
    --red-light: #ffecef;
    --blue: #4e8ee8;
    --blue-light: #eaf2ff;
    --text: #24222d;
    --muted: #777383;
    --border: #e8e4f2;
    --white: #ffffff;
    --shadow: 0 10px 35px rgba(73, 50, 130, 0.09);
    --radius: 22px;
    --radius-small: 14px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:

            circle at top right,
            rgba(118,84,232,0.08),
            transparent 32%
        ),
        var(--lavender);
    color: var(--text);
    font-family:

        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   HEADER
========================================================= */

.app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(247,245,255,0.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(118,84,232,0.08);
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.brand-icon {
    width: 46px;
    height: 46px;
    border-radius: 15px;
    object-fit: cover;
    box-shadow: 0 6px 20px rgba(118,84,232,0.18);
}

.brand-text h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 900;
}

.brand-text p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--muted);
}

.header-action {
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--white);
    box-shadow: var(--shadow);
    color: var(--purple);
    font-size: 19px;
}

/* =========================================================
   MAIN
========================================================= */

main {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-title {
    margin: 10px 0 5px;
    font-size: 25px;
    font-weight: 950;
}

.section-subtitle {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    background:
        linear-gradient(
            135deg,
            rgba(118,84,232,0.98),
            rgba(151,116,241,0.96)
        );
    color: white;
    border-radius: 30px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(89,62,180,0.22);
    overflow: hidden;
    position: relative;
    margin-bottom: 18px;
}

.hero::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    left: -50px;
    bottom: -80px;
}

.hero::before {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    right: -25px;
    top: -40px;
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero h2 {
    margin: 0 0 8px;
    font-size: 27px;
    font-weight: 950;
}

.hero p {
    margin: 0;
    line-height: 1.8;
    opacity: 0.92;
    font-size: 13px;
}

.hero-stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
    margin-top: 18px;
}

.hero-stat {
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 17px;
    padding: 12px 8px;
    text-align: center;
}

.hero-stat strong {
    display: block;
    font-size: 22px;
}

.hero-stat span {
    font-size: 10px;
    opacity: .85;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: none;
    border-radius: 15px;
    padding: 11px 16px;
    font-weight: 800;
    transition: transform .15s ease, box-shadow .15s ease;

.btn:active {
    transform: scale(.96);
}

.btn-primary {
    background: var(--purple);
    color: white;
    box-shadow: 0 7px 18px rgba(118,84,232,.2);
}

.btn-secondary {
    background: var(--purple-light);
    color: var(--purple-dark);
}

.btn-white {
    background: white;
    color: var(--purple-dark);
}

.btn-danger {
    background: var(--red-light);
    color: #b92e3d;
}

.btn-success {
    background: var(--green-light);
    color: #16804d;
}

.btn-small {
    padding: 8px 11px;
    border-radius: 11px;
    font-size: 12px;
}

   DASHBOARD GRID
========================================================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.dashboard-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 17px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .18s ease;
}

.dashboard-card:active {
    transform: scale(.98);
}

.dashboard-card .icon {
    width: 44px;
    height: 44px;
    border-radius: 15px;
    background: var(--purple-light);
    display: grid;
    place-items: center;
    font-size: 22px;
    margin-bottom: 12px;
}

.dashboard-card h3 {
    margin: 0 0 5px;
    font-size: 14px;
}

.dashboard-card p {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
}

.search-box input {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    border-radius: 15px;
    padding: 12px 42px 12px 13px;
    outline: none;
}

.search-box span {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.select-control {
    border: 1px solid var(--border);
    background: white;
    border-radius: 15px;
    padding: 0 13px;
    outline: none;
    color: var(--text);
}

   CATEGORY CHIPS
========================================================= */

.chips {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 15px;
    scrollbar-width: none;
}

.chips::-webkit-scrollbar {
    display: none;
}

.chip {
    white-space: nowrap;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    border-radius: 30px;
    padding: 8px 13px;
    font-size: 11px;
    font-weight: 750;
}

.chip.active {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
}

   MOVEMENT GRID
========================================================= */

.moves-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px;

.move-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .18s ease;

.move-card:active {

.move-visual {
    background:

            #ffffff,
            #f0edff

    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.move-level {
    position: absolute;
    top: 9px;
    right: 9px;
    background: rgba(255,255,255,.92);
    border-radius: 10px;
    padding: 5px 8px;
    font-size: 9px;
    font-weight: 900;
    color: var(--purple-dark);

.move-info {
    padding: 13px;
}

.move-info h3 {
    font-size: 14px;
    margin: 0 0 4px;
}

.move-info .english {
    direction: ltr;
    text-align: left;
    color: var(--purple);
    font-weight: 850;
    font-size: 11px;
    margin-bottom: 6px;

.move-info p {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
    margin: 0 0 10px;

.move-actions {

    gap: 6px;
}

.move-actions button {
    flex: 1;
    border: none;
    border-radius: 11px;
    padding: 8px 4px;
    font-size: 10px;
    font-weight: 800;
}

/* =========================================================
   RENDER MOVES
========================================================= */

function renderMoves() {

    const grid =
        document.getElementById("movesGrid");

    if (!grid) return;


    const search =
        (
            document
                .getElementById("moveSearch")
                ?.value || ""
        )
        .trim()
        .toLowerCase();


    const level =
        document
            .getElementById("levelFilter")
            ?.value || "all";


    let list =
        MOVES.filter(move => {

            const categoryOK =
                activeCategory === "الكل" ||
                move.cat === activeCategory;


            const levelOK =
                level === "all" ||
                move.level === level;


            const searchOK =
                !search ||
                move.ar.toLowerCase().includes(search) ||
                move.en.toLowerCase().includes(search) ||
                move.cat.toLowerCase().includes(search);


            return (
                categoryOK &&
                levelOK &&
                searchOK
            );

        });


    if (!list.length) {

        grid.innerHTML = `

            <div
                class="empty-state"
                style="grid-column:1/-1;"
            >

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    ما لقيتش الحركة
                </h3>

                <p>
                    جربي كلمة أخرى أو اختاري تصنيفاً مختلفاً.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        list
            .map(move => {

                const learned =
                    !!state.learned[move.id];


                return `

                    <article
                        class="move-card"
                        data-id="${escapeHTML(move.id)}"
                    >

                        <div class="move-visual">

                            <span class="move-level">
                                ${escapeHTML(move.level)}
                            </span>

                            ${poseSVG(move,true)}

                        </div>


                        <div class="move-info">

                            <h3>
                                ${escapeHTML(move.ar)}
                            </h3>

                            <div class="english">
                                ${escapeHTML(move.en)}
                            </div>

                            <p>
                                ${escapeHTML(move.desc)}
                            </p>


                            <div class="move-actions">

                                <button
                                    style="
                                        background:#eeeaff;
                                        color:#5b3ec4;
                                    "
                                    onclick="openMove('${escapeHTML(move.id)}')"
                                >
                                    👁️ الحركة
                                </button>


                                <button
                                    style="
                                        background:#e8f8ef;
                                        color:#16804d;
                                    "
                                    onclick="addMoveToBuilder('${escapeHTML(move.id)}')"
                                >
                                    ＋ Series
                                </button>

                            </div>


                            ${
                                learned
                                    ? `
                                        <div
                                            style="
                                                margin-top:8px;
                                                color:#16804d;
                                                font-size:9px;
                                                font-weight:900;
                                            "
                                        >
                                            ✓ تعلمتها
                                        </div>
                                    `
                                    : ""
                            }

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* =========================================================
   OPEN MOVE
========================================================= */

function getMove(id) {

    return MOVES.find(
        move => move.id === id
    );

}


function openMove(id) {

    const move =
        getMove(id);

    if (!move) return;


    document.getElementById(
        "modalMoveName"
    ).textContent =
        move.ar;


    document.getElementById(
        "modalMoveVisual"
    ).innerHTML =
        poseSVG(move,true,true);


    document.getElementById(
        "modalMoveMeta"
    ).innerHTML = `

        <span class="meta-pill">
            🇬🇧 ${escapeHTML(move.en)}
        </span>

        <span class="meta-pill">
            ${escapeHTML(move.cat)}
        </span>

        <span class="meta-pill">
            ${escapeHTML(move.level)}
        </span>

        <span class="meta-pill">
            🎯 ${escapeHTML(move.target)}
        </span>

        <span class="meta-pill">
            🦵 ${escapeHTML(move.side)}
        </span>

    `;


    document.getElementById(
        "modalMoveDescription"
    ).textContent =
        move.desc;


    document.getElementById(
        "modalAddSeriesBtn"
    ).onclick = () => {

        addMoveToBuilder(move.id);

        closeModal("moveModal");

        showToast(
            "تمت إضافة الحركة للـ Series 🔥"
        );

    };


    document.getElementById(
        "modalLearnBtn"
    ).onclick = () => {

        toggleLearned(move.id);

    };


    openModal("moveModal");

}


/* =========================================================
   LEARNED
========================================================= */

function toggleLearned(id) {

    state.learned[id] =
        !state.learned[id];

    saveState();

    renderMoves();

    showToast(
        state.learned[id]
            ? "✓ تسجلت كحركة تعلمتيها"
            : "تم إلغاء علامة التعلم"
    );

}


/* =========================================================
   SERIES BUILDER STATE
========================================================= */

let builder = [];

let seriesSpeed = 1;

let seriesTimer = null;

let seriesPlaying = false;

let seriesIndex = 0;


/* =========================================================
   ADD TO BUILDER
========================================================= */

function addMoveToBuilder(id) {

    const move =
        getMove(id);

    if (!move) return;


    builder.push(id);


    saveBuilderSession();

    renderBuilder();

    showToast(
        `＋ ${move.ar}`
    );


    showSection("series");

}


function removeBuilderItem(index) {

    if (
        index < 0 ||
        index >= builder.length
    ) return;


    builder.splice(index,1);

    saveBuilderSession();

    renderBuilder();

}


function clearBuilder() {

    stopSeriesPlayback();

    builder = [];

    saveBuilderSession();

    renderBuilder();

    showToast(
        "تم مسح الـ Series الحالية"
    );

}


/* =========================================================
   BUILDER SESSION
========================================================= */

function saveBuilderSession() {

    sessionStorage.setItem(
        "boxing_builder",
        JSON.stringify(builder)
    );

}


function loadBuilderSession() {

    try {

        const saved =
            sessionStorage.getItem(
                "boxing_builder"
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {

                builder = parsed.filter(
                    id => !!getMove(id)
                );

            }

        }

    } catch (error) {

        builder = [];

    }

}


/* =========================================================
   RENDER BUILDER
========================================================= */

function renderBuilder() {

    const strip =
        document.getElementById(
            "builderStrip"
        );

    if (!strip) return;


    if (!builder.length) {

/* =========================================================
   PLAY SERIES
========================================================= */

function playCurrentSeries() {

    if (!builder.length) {

        showToast(
            "أضيفي حركات للـ Series أولاً 🥊"
        );

        return;

    }


    stopSeriesPlayback();


    const player =
        document.getElementById(
            "seriesPlayer"
        );


    player.classList.remove("hidden");


    seriesPlaying = true;

    seriesIndex = 0;


    showSeriesFrame();


    const duration =
        1500 / seriesSpeed;


    seriesTimer =
        setInterval(() => {

            seriesIndex++;


            if (
                seriesIndex >=
                builder.length
            ) {

                seriesIndex = 0;

            }


            showSeriesFrame();

        },duration);

}


function showSeriesFrame() {

    const id =
        builder[seriesIndex];

    const move =
        getMove(id);

    if (!move) return;


    document.getElementById(
        "seriesAnimationVisual"
    ).innerHTML =
        poseSVG(
            move,
            true,
            true
        );


    document.getElementById(
        "seriesCurrentLabel"
    ).textContent =

        `${seriesIndex + 1} / ${builder.length} — ${move.en}`;

}


function stopSeriesPlayback() {

    if (seriesTimer) {

        clearInterval(seriesTimer);

        seriesTimer = null;

    }


    seriesPlaying = false;

}

/* =========================================================
   DELETE SERIES
========================================================= */

function deleteSeries(id) {

    const series =
        state.series.find(
            item => item.id === id
        );


    if (!series) return;


    const confirmed =
        confirm(
            `حذف "${series.name}"؟`
        );


    if (!confirmed) return;


    state.series =
        state.series.filter(
            item => item.id !== id
        );


    delete state.ratings[id];


    saveState();

    renderSavedSeries();

    renderTracking();

    updateHomeStats();

    showToast(
        "تم حذف الـ Series"
    );

}

function addNextPaymentMonth() {

    let nextDate;


    if (!state.payments.length) {

        nextDate =
            new Date(
                "2026-09-15T00:00:00"
            );

    } else {

        const last =
            state.payments[
                state.payments.length - 1
            ];


        nextDate =
            new Date(
                last.date
            );


        nextDate.setMonth(
            nextDate.getMonth() + 1
        );

    }


    const label =
        nextDate.toLocaleDateString(
            "fr-FR",
            {
                month:"long",
                year:"numeric"
            }
        );


    state.payments.push({

        date:
            nextDate.toISOString(),

        label,

        paid:false

    });


    saveState();

    renderPayments();


    showToast(
        "تمت إضافة شهر جديد 💳"
    );

}


function togglePayment(index) {

    if (
        !state.payments[index]
    ) return;


    state.payments[index].paid =
        !state.payments[index].paid;


    saveState();

    renderPayments();


    showToast(
        state.payments[index].paid
            ? "✓ تم تسجيل الأداء"
            : "تم إلغاء الأداء"
    );

}

        );


    const blob =
        new Blob(
            [data],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "boxing-memory-backup.json";


    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);


    showToast(
        "📤 تم تصدير بياناتك"
    );

}


function importData(event) {

    const file =
        event.target.files?.[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload = () => {

        try {

            const imported =
                JSON.parse(
                    reader.result
                );


            state = {

                ...structuredClone(
                    defaultState
                ),

                ...imported

            };


            saveState();


            renderAll();

            showToast(
                "📥 تم استرجاع البيانات"
            );


        } catch (error) {

            console.error(error);

            showToast(
                "الملف غير صالح ❌"
            );

        }

    };


    reader.readAsText(file);

}


function resetAllData() {

    const confirmed =
        confirm(
            "متأكدة أنك تريدين حذف كل البيانات؟"
        );


    if (!confirmed)
        return;


    localStorage.removeItem(
        STORAGE_KEY
    );


    sessionStorage.removeItem(
        "boxing_builder"
    );


    state =
        structuredClone(
            defaultState
        );


    builder = [];


    renderAll();

    closeModal(
        "settingsModal"
    );


    showToast(
        "تم حذف البيانات"
    );

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderAll() {

    renderCategories();

    renderMoves();

    renderBuilder();

    renderSavedSeries();

    renderDictionary();

    renderTracking();

    renderClasses();

    renderPayments();

    updateHomeStats();

    renderHomeAnimation();

}


/* =========================================================
   INITIALIZATION
========================================================= */

loadBuilderSession();

renderAll();


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./sw.js")
                .then(
                    registration => {

                        console.log(
                            "Service Worker registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "Service Worker failed:",
                            error
                        );

                    }
                );

        }
    );

}


/* =========================================================
   KEYBOARD / ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key !== "Escape")
            return;


        document
            .querySelectorAll(
                ".modal-backdrop.open"
            )
            .forEach(modal => {

                modal.classList.remove(
                    "open"
                );

            });

    }
);


/* =========================================================
   PREVENT ACCIDENTAL FORM SUBMIT
========================================================= */

document.addEventListener(
    "submit",
    event => {

        event.preventDefault();

    }
);

</script>
