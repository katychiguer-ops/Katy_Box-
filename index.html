<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kickboxing Memory</title>
    
    <!-- App Icon -->
    <link rel="icon" type="image/png" href="AED5A342-A9AB-4969-88BA-3C9E7AF7949F.png">
    <link rel="apple-touch-icon" href="AED5A342-A9AB-4969-88BA-3C9E7AF7949F.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary: #6d4aff;
            --primary-light: #a38bff;
            --accent: #ff6b9d;
            --accent-light: #ffb6c9;
            --background: #faf5ff;
            --surface: #ffffff;
            --text-primary: #2d2d44;
            --text-secondary: #6b6b8a;
            --success: #00d285;
            --warning: #ffc857;
            --danger: #ff477e;
            --shadow: rgba(109, 74, 255, 0.15);
            --card-shadow: 0 8px 24px var(--shadow);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #efe5ff 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
            border-radius: 0 0 30px 30px;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        /* Navigation */
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 12px 8px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            border-radius: 12px;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-light) 100%);
            color: var(--primary);
            font-weight: bold;
        }
        
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }
        
        /* Sections */
        section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }
        
        section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }
        
        .card {
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 16px;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-light);
        }
        
        .card.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--surface) 100%);
        }
        
        .card svg {
            width: 100%;
            height: 120px;
            margin-bottom: 12px;
        }
        
        .card h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .card .badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }
        
        /* Buttons */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            box-shadow: 0 4px 16px var(--shadow);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary-light);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        /* Form Elements */
        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0eb;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--shadow);
        }
        
        /* Animation Preview */
        .animation-preview {
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 16px 0;
            box-shadow: var(--card-shadow);
            text-align: center;
        }
        
        .animation-stage {
            width: 200px;
            height: 200px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #f5f0ff 0%, #ede5ff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .speed-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }
        
        .speed-btn {
            padding: 8px 16px;
            border: 2px solid var(--primary-light);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .speed-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Tracking */
        .progress-bar {
            height: 8px;
            background: #e0e0eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            transition: width 0.5s ease;
        }
        
        .rating {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        
        .rating-option {
            padding: 8px 16px;
            border: 2px solid #e0e0eb;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        
        .rating-option.selected {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        
        /* Schedule */
        .schedule-row {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .checkbox-custom {
            width: 28px;
            height: 28px;
            border: 2px solid #e0e0eb;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .checkbox-custom.checked {
            background: var(--success);
            border-color: var(--success);
        }
        
        .payment-month {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .payment-month.paid {
            background: #e8fff5;
            border-left: 4px solid var(--success);
        }
        
        .payment-toggle {
            width: 52px;
            height: 28px;
            background: #e0e0eb;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .payment-toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            right: 2px;
            transition: var(--transition);
        }
        
        .payment-toggle.active {
            background: var(--success);
        }
        
        .payment-toggle.active::after {
            right: 26px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* SVG Animation Styles */
        .animate-move {
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        
        .arm-right { transition: transform 0.3s ease; }
        .arm-left { transition: transform 0.3s ease; }
        .leg-right { transition: transform 0.3s ease; }
        .leg-left { transition: transform 0.3s ease; }
        
        /* Category Filter */
        .category-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .category-btn {
            padding: 8px 16px;
            border: none;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        
        .category-btn.active {
            background: var(--primary);
            color: white;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 16px 28px;
            border-radius: 12px;
            opacity: 0;
            transition: var(--transition);
            z-index: 3000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🥊 ذاكرة الملاكمة</h1>
            <p>حفظ ما تتعلمين في الصالة</p>
        </header>
        
        <!-- Section 1: Cards -->
        <section id="cards-section" class="active">
            <div class="category-filter" id="categoryFilter"></div>
            
            <h2 style="margin-bottom: 16px;">بطاقات الحركات</h2>
            <div class="grid" id="cardsGrid"></div>
        </section>
        
        <!-- Section 2: Series Builder -->
        <section id="series-section">
            <h2 style="margin-bottom: 16px;">صناعة السلسلة</h2>
            
            <div class="card" style="margin-bottom: 16px;">
                <input type="text" id="seriesName" placeholder="اسم السلسلة (مثلاً: حصة الأربعاء)">
                <p style="font-size: 0.85rem; color: var(--text-secondary);">
                    اختر حركات من بطاقات الحركات لإضافتها هنا
                </p>
            </div>
            
            <div id="selectedMoves" class="grid" style="margin-bottom: 16px;"></div>
            
            <button class="btn btn-primary" onclick="previewSeries()" style="width: 100%; margin-bottom: 16px;">
                ▶️ معاينة السلسلة
            </button>
            
            <div class="animation-preview" id="seriesPreview" style="display: none;">
                <h3 style="margin-bottom: 12px;">معاينة متحركة</h3>
                <div class="animation-stage" id="animationStage">
                    <!-- SVG will be inserted here -->
                </div>
                <div class="speed-controls">
                    <button class="speed-btn" onclick="setSpeed(0.5)">🐢 بطيء</button>
                    <button class="speed-btn active" onclick="setSpeed(1)">▶️ عادي</button>
                    <button class="speed-btn" onclick="setSpeed(1.5)">⚡ سريع</button>
                    <button class="speed-btn" onclick="toggleAnimation()">◼️ إيقاف</button>
                </div>
            </div>
            
            <button class="btn btn-success" onclick="saveSeries()" style="width: 100%;" id="saveSeriesBtn">
                💾 حفظ السلسلة
            </button>
            
            <h2 style="margin-top: 32px; margin-bottom: 16px;">السلاسل المحفوظة</h2>
            <div id="savedSeriesList"></div>
        </section>
        
        <!-- Section 3: Dictionary -->
        <section id="dictionary-section">
            <h2 style="margin-bottom: 16px;">المعجم</h2>
            <input type="text" id="searchDict" placeholder="ابحث عن حركة..." onkeyup="filterDictionary()">
            <div class="grid" id="dictionaryGrid"></div>
        </section>
        
        <!-- Section 4: Tracking -->
        <section id="tracking-section">
            <h2 style="margin-bottom: 16px;">تتبع التطور</h2>
            <div id="trackingList"></div>
        </section>
        
        <!-- Section 5: Gym Schedule -->
        <section id="schedule-section">
            <h2 style="margin-bottom: 16px;">حصص الصالة</h2>
            <div id="gymSchedule"></div>
            
            <h2 style="margin-top: 32px; margin-bottom: 16px;">الدفع</h2>
            <div class="card" style="margin-bottom: 16px;">
                <label>بداية الاشتراك:</label>
                <input type="date" id="subscriptionStart" value="2026-09-15">
            </div>
            <div id="paymentTracker"></div>
        </section>
        
        <!-- Edit Modal -->
        <div class="modal" id="editModal">
            <div class="modal-content">
                <h2 style="margin-bottom: 16px;">تعديل الاسم</h2>
                <p id="editMovementName" style="margin-bottom: 16px; color: var(--text-secondary);"></p>
                <label>الاسم الذي يستخدمه مدربك:</label>
                <input type="text" id="customNameInput" placeholder="اكتبي الاسم هنا">
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="saveCustomName()" style="flex: 1;">حفظ</button>
                    <button class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">إلغاء</button>
                </div>
            </div>
        </div>
        
        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>
    
    <!-- Navigation -->
    <nav>
        <button class="nav-item active" onclick="showSection('cards')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <span>الحركات</span>
        </button>
        <button class="nav-item" onclick="showSection('series')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg>
            <span>السلاسل</span>
        </button>
        <button class="nav-item" onclick="showSection('dictionary')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
            <span>المعجم</span>
        </button>
        <button class="nav-item" onclick="showSection('tracking')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
            <span>التطور</span>
        </button>
        <button class="nav-item" onclick="showSection('schedule')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>الصالة</span>
        </button>
    </nav>
    
    <script>
        // ==================== MOVEMENT DATABASE ====================
        const movementDB = [
            // Basic Punches
            {id: "jab", arabic: " jab (ضربة مستقيمة باليسار)", english: "Jab", category: "لكمات أساسية", level: "مبتدئ", 
             visual: {type: "straight-punch", side: "left", limb: "arm"}},
            {id: "cross", arabic: "كروس (ضربة مستقيمة باليمين)", english: "Cross", category: "لكمات أساسية", level: "مبتدئ",
             visual: {type: "straight-punch", side: "right", limb: "arm"}},
            {id: "lead-hook", arabic: "ضربة مقوسة باليسار", english: "Lead Hook", category: "لكمات مقوسة", level: "مبتدئ",
             visual: {type: "hook", side: "left", limb: "arm"}},
            {id: "rear-hook", arabic: "ضربة مقوسة باليمين", english: "Rear Hook", category: "لكمات مقوسة", level: "مبتدئ",
             visual: {type: "hook", side: "right", limb: "arm"}},
            {id: "lead-uppercut", arabic: "أبيركانت باليسار", english: "Lead Uppercut", category: "Uppercuts", level: "متوسط",
             visual: {type: "uppercut", side: "left", limb: "arm"}},
            {id: "rear-uppercut", arabic: "أبيركانت باليمين", english: "Rear Uppercut", category: "Uppercuts", level: "متوسط",
             visual: {type: "uppercut", side: "right", limb: "arm"}},
            {id: "overhand-right", arabic: "أوفر هاند باليمين", english: "Overhand Right", category: "Overhands", level: "متوسط",
             visual: {type: "overhand", side: "right", limb: "arm"}},
            
            // Kicks - Low
            {id: "low-kick-r", arabic: "ركلة منخفضة باليمين", english: "Low Roundhouse Kick", category: "ركلات منخفضة", level: "مبتدئ",
             visual: {type: "roundhouse-kick", side: "right", limb: "leg", height: "low"}},
            {id: "low-kick-l", arabic: "ركلة منخفضة باليسار", english: "Low Roundhouse Kick", category: "ركلات منخفضة", level: "مبتدئ",
             visual: {type: "roundhouse-kick", side: "left", limb: "leg", height: "low"}},
            
            // Kicks - Medium
            {id: "mid-kick-r", arabic: "ركلة وسطية باليمين", english: "Mid Roundhouse Kick", category: "ركلات متوسطة", level: "مبتدئ",
             visual: {type: "roundhouse-kick", side: "right", limb: "leg", height: "mid"}},
            {id: "mid-kick-l", arabic: "ركلة وسطية باليسار", english: "Mid Roundhouse Kick", category: "ركلات متوسطة", level: "مبتدئ",
             visual: {type: "roundhouse-kick", side: "left", limb: "leg", height: "mid"}},
            
            // Kicks - High
            {id: "high-kick-r", arabic: "ركلة مرتفعة باليمين", english: "High Kick", category: "ركلات عالية", level: "متقدم",
             visual: {type: "roundhouse-kick", side: "right", limb: "leg", height: "high"}},
            {id: "high-kick-l", arabic: "ركلة مرتفعة باليسار", english: "High Kick", category: "ركلات عالية", level: "متقدم",
             visual: {type: "roundhouse-kick", side: "left", limb: "leg", height: "high"}},
            
            // Front Kicks
            {id: "front-kick-r", arabic: "فرونت كيك باليمين", english: "Front Kick", category: "Front Kicks", level: "مبتدئ",
             visual: {type: "front-kick", side: "right", limb: "leg"}},
            {id: "front-kick-l", arabic: "فرونت كيك باليسار", english: "Front Kick", category: "Front Kicks", level: "مبتدئ",
             visual: {type: "front-kick", side: "left", limb: "leg"}},
            
            // Side Kicks
            {id: "side-kick-r", arabic: "سايد كيك باليمين", english: "Side Kick", category: "Side Kicks", level: "متوسط",
             visual: {type: "side-kick", side: "right", limb: "leg"}},
            {id: "side-kick-l", arabic: "سايد كيك باليسار", english: "Side Kick", category: "Side Kicks", level: "متوسط",
             visual: {type: "side-kick", side: "left", limb: "leg"}},
            
            // Teep/Push Kick
            {id: "teep-r", arabic: "تيب (ركلة دفع) باليمين", english: "Push Kick / Teep", category: "Push Kicks", level: "مبتدئ",
             visual: {type: "teep", side: "right", limb: "leg"}},
            
            // Back Kick
            {id: "back-kick", arabic: "باك كيك (ركلة للخلف)", english: "Back Kick", category: "Spinning Kicks", level: "متقدم",
             visual: {type: "back-kick", side: "both", limb: "leg"}},
            
            // Knee Strikes
            {id: "knee-straight", arabic: "ركبة مستقيمة", english: "Straight Knee", category: "Knee Strikes", level: "مبتدئ",
             visual: {type: "knee-straight", side: "both", limb: "leg"}},
            {id: "knee-clinch", arabic: "ركبة من الكلاينش", english: "Clinch Knee", category: "Knee Strikes", level: "مبتدئ",
             visual: {type: "knee-clinch", side: "both", limb: "leg"}},
            
            // Elbows

        // ==================== STATE MANAGEMENT ====================

        // ==================== CATEGORY FILTER ====================
        function renderCategories() {

            const filterDiv = document.getElementById('categoryFilter');
            
            let html = `<button class="category-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">الكل</button>`;
            categories.forEach(cat => {

            });

        }
        
        function filterByCategory(category) {
            currentCategory = category;
            renderCategories();
            renderCards();
        }
        
        // ==================== CARD RENDERING ====================
        function renderCards() {
            const filtered = currentCategory === 'all' 
                ? movementDB 
                : movementDB.filter(m => m.category === currentCategory);
            
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = filtered.map(move => `

        // ==================== SVG ANIMATION GENERATOR ====================
        function renderSVG(visual, animate = true) {
            const baseColor = '#6d4aff';
            const accentColor = '#ff6b9d';
            const skinColor = '#ffd5b5';
            
            let animationClass = animate ? ' animate-move' : '';
            let dynamicStyle = '';
            
            switch(visual.type) {
                case 'straight-punch':
                    dynamicStyle = visual.side === 'right' ? 
                        '.arm-right{transform-origin:left center;animation:punchRight 1s infinite}' :
                        '.arm-left{transform-origin:right center;animation:punchLeft 1s infinite}';
                    break;
                case 'hook':
                    dynamicStyle = visual.side === 'right' ?
                        '.arm-right{transform-origin:left center;animation:hookRight 1.5s infinite}' :
                        '.arm-left{transform-origin:right center;animation:hookLeft 1.5s infinite}';
                    break;
                case 'uppercut':
                    dynamicStyle = visual.side === 'right' ?
                        '.arm-right{transform-origin:left bottom;animation:uppercutRight 1.5s infinite}' :
                        '.arm-left{transform-origin:right bottom;animation:uppercutLeft 1.5s infinite}';
                    break;
                case 'roundhouse-kick':
                    const kickDelay = visual.height === 'high' ? '0s' : visual.height === 'mid' ? '0.5s' : '1s';
                    dynamicStyle = `.leg-${visual.side}{transform-origin:top center;animation:kickRoundhouse 2s infinite ${kickDelay}}`;
                    break;
                case 'front-kick':
                    dynamicStyle = `.leg-${visual.side}{transform-origin:top center;animation:kickFront 1.5s infinite}`;
                    break;
                case 'side-kick':
                    dynamicStyle = `.leg-${visual.side}{transform-origin:center right;animation:kickSide 2s infinite}`;
                    break;
                case 'teep':
                    dynamicStyle = `.leg-${visual.side}{transform-origin:bottom center;animation:kickTeep 1.5s infinite}`;
                    break;
                case 'back-kick':
                    dynamicStyle = '.leg-right{animation:backKick 2s infinite}.leg-left{animation:backKick 2s infinite 1s}';
                    break;
                case 'knee-straight':
                case 'knee-clinch':
                    dynamicStyle = '.leg-right{transform-origin:top center;animation:kneeStrikes 1.5s infinite}';
                    break;
                case 'elbow-horizontal':
                    dynamicStyle = `.arm-${visual.side}{animation:elbowHorizontal 1.5s infinite}`;
                    break;
                case 'slip':
                    dynamicStyle = visual.direction === 'outside' ?
                        'circle.head{animation:slipOut 1s infinite}' :
                        'circle.head{animation:slipIn 1s infinite}';
                    break;
                case 'roll':
                    dynamicStyle = '.ellipse.body{animation:rollBody 1.5s infinite}';
                    break;
                case 'block':
                    dynamicStyle = visual.height === 'high' ?
                        '.rect.block{animation:blockHigh 1s infinite}' :
                        '.rect.block{animation:blockLow 1s infinite}';
                    break;
                case 'step':
                    dynamicStyle = visual.direction === 'forward' ?
                        '.circle.foot{animation:stepForward 1.5s infinite}' :
                        '.circle.foot{animation:stepBack 1.5s infinite}';
                    break;
                case 'pivot':
                    dynamicStyle = 'circle.head{animation:pivotHead 2s infinite} rect.body{animation:pivotBody 2s infinite}';
                    break;
            }
            
            return `<svg viewBox="0 0 200 200" style="overflow:hidden;">
                <defs>
                    <style>
                        ${dynamicStyle}
                        @keyframes punchRight { 0%,100%{transform:translateX(0)} 50%{transform:translateX(60px)} }
                        @keyframes punchLeft { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-60px)} }
                        @keyframes hookRight { 0%,100%{transform:rotate(0)} 50%{transform:rotate(120deg)} }
                        @keyframes hookLeft { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-120deg)} }
                        @keyframes uppercutRight { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-50px) rotate(-45deg)} }
                        @keyframes uppercutLeft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-50px) rotate(45deg)} }
                        @keyframes kickRoundhouse { 0%,100%{transform:rotate(0)} 50%{transform:rotate(${visual.height==='high'?150:visual.height==='mid'?120:90}deg)} }
                        @keyframes kickFront { 0%,100%{transform:rotate(0)} 50%{transform:translateY(-60px)} }
                        @keyframes kickSide { 0%,100%{transform:rotate(0)} 50%{transform:rotate(140deg)} }
                        @keyframes kickTeep { 0%,100%{transform:rotate(0)} 50%{transform:translateY(-50px) rotate(90deg)} }
                        @keyframes backKick { 0%,100%{transform:rotate(0)} 50%{transform:rotate(160deg)} }
                        @keyframes kneeStrikes { 0%,100%{transform:rotate(0)} 50%{transform:translateY(-40px) rotate(30deg)} }
                        @keyframes elbowHorizontal { 0%,100%{transform:rotate(0)} 50%{transform:rotate(${visual.side==='right'?120:-120}deg)} }
                        @keyframes slipOut { 0%,100%{cx:100} 50%{cx:130} }
                        @keyframes slipIn { 0%,100%{cx:100} 50%{cx:70} }
                        @keyframes rollBody { 0%,100%{rx:30 ry:40} 50%{rx:25 ry:45} }
                        @keyframes blockHigh { 0%,100%{y:30} 50%{y:20} }
                        @keyframes blockLow { 0%,100%{y:70} 50%{y:80} }
                        @keyframes stepForward { 0%,100%{cy:180} 50%{cy:160} }
                        @keyframes stepBack { 0%,100%{cy:180} 50%{cy:170} }
                        @keyframes pivotHead { 0%,100%{r:20} 50%{r:25} }
                        @keyframes pivotBody { 0%,100%{ry:40} 50%{ry:35} }
                    </style>
                </defs>
                
                <!-- Body -->
                <ellipse class="body" cx="100" cy="110" rx="30" ry="${visual.part==='body'?'45':'40'}" fill="${baseColor}" opacity="0.3"/>
                
                <!-- Head -->
                <circle class="head" cx="100" cy="45" r="22" fill="#2d2d44"/>
                
                <!-- Arms -->
                <g class="arm-left">
                    <line x1="100" y1="75" x2="50" y2="100" stroke="${baseColor}" stroke-width="12" stroke-linecap="round"/>
                </g>
                <g class="arm-right">
                    <line x1="100" y1="75" x2="150" y2="100" stroke="${accentColor}" stroke-width="12" stroke-linecap="round"/>
                </g>
                
                <!-- Legs -->
                <g class="leg-left">
                    <line x1="90" y1="150" x2="80" y2="190" stroke="${baseColor}" stroke-width="10" stroke-linecap="round"/>
                </g>
                <g class="leg-right">
                    <line x1="110" y1="150" x2="120" y2="190" stroke="${accentColor}" stroke-width="10" stroke-linecap="round"/>
                </g>
                
                <!-- Arrow for direction -->
                ${(visual.side && ['right','left'].includes(visual.side)) ? 
                    `<polygon points="${visual.side==='right'?155:45},${visual.limb==='arm'?100:190} ${visual.side==='right'?180:20},${visual.limb==='arm'?90:200} ${visual.side==='right'?180:20},${visual.limb==='arm'?110:180}" fill="${accentColor}" opacity="0.6"/>` : ''}
                
                <!-- Action highlight -->
                <circle cx="100" cy="100" r="45" fill="none" stroke="${accentColor}" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
            </svg>`;
        }
        
        // ==================== MOVE DETAIL ====================
        let currentEditingId = null;
        
        function viewMoveDetail(moveId) {
            const move = movementDB.find(m => m.id === moveId);
            if(!move) return;
            
            // Show modal for detail view with edit option
            showToast(`📝 "${move.arabic.trim()}"\n${move.english}\n\nاضغطي لتعديل الاسم`);
            
            setTimeout(() => {
                openEditModal(move);
            }, 500);
        }
        
        function openEditModal(move) {
            currentEditingId = move.id;
            document.getElementById('editMovementName').textContent = move.arabic.trim() + '\n' + move.english;
            document.getElementById('customNameInput').value = customNames[move.id] || '';
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditingId = null;
        }
        
        function saveCustomName() {
            const customName = document.getElementById('customNameInput').value.trim();
            if(currentEditingId && customName) {
                customNames[currentEditingId] = customName;
                localStorage.setItem('customNames', JSON.stringify(customNames));
                showToast('✅ تم حفظ الاسم الجديد');
                renderDictionary();
            }
            closeModal();
        }
        
        // ==================== SERIES BUILDER ====================
        function addToSeries(moveId) {
            if(selectedMoves.length >= 8) {
                showToast('⚠️ الحد الأقصى 8 حركات في السلسلة');
                return;
            }
            
            const move = movementDB.find(m => m.id === moveId);
            if(move && !selectedMoves.find(m => m.id === moveId)) {
                selectedMoves.push(move);
                renderSelectedMoves();
                showToast('➕ تمت إضافة الحركة للسلسلة');
            }
        }
        
        function removeFromSeries(index) {
            selectedMoves.splice(index, 1);
            renderSelectedMoves();
        }
        
        function renderSelectedMoves() {
            const container = document.getElementById('selectedMoves');
            if(selectedMoves.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد حركات مضافة بعد<br>اضغطي على أي بطاقة لإضافتها</div>';
                return;
            }
            
            container.innerHTML = selectedMoves.map((move, idx) => `
                <div class="card selected" style="position:relative;">
                    <span onclick="removeFromSeries(${idx})" style="position:absolute;top:8px;right:8px;background:var(--danger);color:white;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;cursor:pointer;font-size:16px;">×</span>
                    ${renderSVG(move.visual, false)}
                    <h3>${move.arabic.trim()}</h3>
                    <p>${move.english}</p>
                </div>
            `).join('');
        }
        
        function previewSeries() {
            if(selectedMoves.length === 0) {
                showToast('⚠️ أضفي حركات أولاً');
                return;
            }
            
            const stage = document.getElementById('animationStage');
            document.getElementById('seriesPreview').style.display = 'block';
            
            // Create animated sequence
            stage.innerHTML = renderSVG(selectedMoves[0].visual, true);
            
            // Cycle through moves
            let moveIndex = 0;
            clearInterval(window.seriesInterval);
            window.seriesInterval = setInterval(() => {
                if(!isAnimating) return;
                
                stage.innerHTML = renderSVG(selectedMoves[moveIndex].visual, true);
                showToast(`▶️ الآن: ${selectedMoves[moveIndex].arabic.trim().substring(0, 30)}...`);
                
                moveIndex = (moveIndex + 1) % selectedMoves.length;
            }, 2000 / animationSpeed);
        }
        
        function setSpeed(speed) {
            animationSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function toggleAnimation() {
            isAnimating = !isAnimating;
            showToast(isAnimating ? '▶️ استئناف' : '⏸️ إيقاف');
        }
        
        function saveSeries() {
            if(selectedMoves.length === 0) {
                showToast('⚠️ لا توجد حركات للحفظ');
                return;
            }
            
            const name = document.getElementById('seriesName').value.trim();
            if(!name) {
                showToast('⚠️ اكتبي اسم السلسلة');
                return;
            }
            
            const series = {
                id: Date.now(),
                name: name,
                moves: [...selectedMoves],
                date: new Date().toISOString(),
                progress: 0,
                ratings: {}
            };
            
            seriesData.push(series);
            localStorage.setItem('seriesData', JSON.stringify(seriesData));
            
            showToast('💾 تم حفظ السلسلة بنجاح');
            
            // Reset
            selectedMoves = [];
            document.getElementById('seriesName').value = '';
            document.getElementById('seriesPreview').style.display = 'none';
            renderSelectedMoves();
            renderSavedSeries();
        }
        
        function renderSavedSeries() {
            const container = document.getElementById('savedSeriesList');
            
            if(seriesData.length === 0) {
                container.innerHTML = '<div class="empty-state">لم تحفظي أي سلاسل بعد<br>صنعي سلسلة جديدة!</div>';
                return;
            }
            
            container.innerHTML = seriesData.map(s => `
                <div class="card" onclick="loadSeries(${s.id})" style="margin:8px 0;">
                    <h3>${s.name}</h3>
                    <p>${s.moves.length} حركات • منذ ${formatDate(s.date)}</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${s.progress}%"></div>
                    </div>
                    <p style="font-size:0.8rem;margin-top:8px;">إتقان: ${s.progress}%</p>
                </div>
            `).join('');
        }
        
        function loadSeries(seriesId) {
            const series = seriesData.find(s => s.id === seriesId);
            if(!series) return;
            
            selectedMoves = [...series.moves];
            renderSelectedMoves();
            showSection('series');
            showToast(`🎯 تم تحميل: ${series.name}`);
        }
        
        // ==================== DICTIONARY ====================
        function renderDictionary(searchTerm = '') {
            const filtered = movementDB.filter(m => 
                searchTerm === '' || 
                m.arabic.includes(searchTerm) || 
                m.english.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            const grid = document.getElementById('dictionaryGrid');

        function filterDictionary() {
            const term = document.getElementById('searchDict').value;
            renderDictionary(term);
        }
        
        // ==================== TRACKING ====================
        function renderTracking() {
            const container = document.getElementById('trackingList');
            
            if(seriesData.length === 0) {
                container.innerHTML = '<div class="empty-state">ابدئي بصناعة سلسلة لرؤية تطورك</div>';
                return;
            }
            
            container.innerHTML = seriesData.map(s => `
                <div class="card" style="margin:8px 0;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <h3>${s.name}</h3>
                        <span class="badge">${s.moves.length} حركات</span>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${s.progress}%"></div>
                    </div>
                    
                    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
                        <div style="flex:1;min-width:120px;">
                            <small>السرعة</small>
                            <select onchange="updateRating(${s.id},'speed',this.value)" style="margin:4px 0;padding:8px;font-size:0.85rem;">
                                <option value="">-</option>
                                <option value="slow" ${s.ratings?.speed==='slow'?'selected':''}>بطيئة</option>
                                <option value="medium" ${s.ratings?.speed==='medium'?'selected':''}>متوسطة</option>
                                <option value="fast" ${s.ratings?.speed==='fast'?'selected':''}>سريعة</option>
                            </select>
                        </div>
                        <div style="flex:1;min-width:120px;">
                            <small>الثبات</small>
                            <select onchange="updateRating(${s.id},'consistency',this.value)" style="margin:4px 0;padding:8px;font-size:0.85rem;">
                                <option value="">-</option>
                                <option value="poor" ${s.ratings?.consistency==='poor'?'selected':''}>ضعيف</option>
                                <option value="good" ${s.ratings?.consistency==='good'?'selected':''}>جيد</option>
                                <option value="excellent" ${s.ratings?.consistency==='excellent'?'selected':''}>ممتاز</option>
                            </select>
                        </div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="practiceSeries(${s.id})" style="margin-top:12px;width:100%;">
                        🏃 تمرّن عليها
                    </button>
                </div>
            `).join('');
        }
        
        function updateRating(seriesId, ratingType, value) {
            const series = seriesData.find(s => s.id === seriesId);
            if(!series) return;
            
            series.ratings = series.ratings || {};
            series.ratings[ratingType] = value;
            
            // Update progress based on ratings
            let progress = series.progress;
            if(value === 'slow') progress = Math.max(20, progress - 5);
            if(value === 'medium') progress = Math.min(70, progress + 10);
            if(value === 'fast') progress = Math.min(100, progress + 15);
            if(value === 'good' || value === 'excellent') progress = Math.min(100, progress + 10);
            
            series.progress = progress;
            localStorage.setItem('seriesData', JSON.stringify(seriesData));
            renderTracking();
            renderSavedSeries();
        }
        
        function practiceSeries(seriesId) {
            const series = seriesData.find(s => s.id === seriesId);
            if(!series) return;
            
            selectedMoves = [...series.moves];
            renderSelectedMoves();
            document.getElementById('seriesName').value = series.name;
            showSection('series');
            previewSeries();
            showToast(`🏃 بدأ التمرين: ${series.name}`);
        }
        
        // ==================== GYM SCHEDULE ====================
        function renderSchedule() {
            const container = document.getElementById('gymSchedule');
            
            container.innerHTML = gymData.schedule.map((item, idx) => `
                <div class="schedule-row">
                    <div>
                        <strong>${item.day}</strong><br>
                        <small style="color:var(--text-secondary);">${item.time}</small>
                    </div>
                    <div class="checkbox-custom ${item.attended ? 'checked' : ''}" onclick="toggleAttendance(${idx})">
                        ${item.attended ? '✓' : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function toggleAttendance(idx) {
            gymData.schedule[idx].attended = !gymData.schedule[idx].attended;
            localStorage.setItem('gymData', JSON.stringify(gymData));
            renderSchedule();
        }
        
        // ==================== PAYMENT TRACKER ====================
        function renderPaymentTracker() {
            const startDate = document.getElementById('subscriptionStart').value;
            localStorage.setItem('subscriptionStart', startDate);
            
            const start = new Date(startDate);
            const today = new Date();
            const months = 6;
            
            const container = document.getElementById('paymentTracker');
            let html = '';
            
            for(let i = 0; i < months; i++) {
                const date = new Date(start);
                date.setMonth(start.getMonth() + i);
                const monthKey = date.toISOString().slice(0, 7);
                const isPaid = gymData.payments[monthKey];
                const monthName = date.toLocaleDateString('ar-EG', {year:'numeric', month:'long'});
                
                html += `
                    <div class="payment-month ${isPaid ? 'paid' : ''}">
                        <span>${monthName}</span>
                        <div class="payment-toggle ${isPaid ? 'active' : ''}" onclick="togglePayment('${monthKey}')"></div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        function togglePayment(monthKey) {
            const element = event.currentTarget;
            const isPaid = element.classList.toggle('active');
            
            if(isPaid) {
                element.classList.add('active');
                element.parentElement.classList.add('paid');
                gymData.payments[monthKey] = true;
            } else {
                element.classList.remove('active');
                element.parentElement.classList.remove('paid');
                delete gymData.payments[monthKey];
            }
            
            localStorage.setItem('gymData', JSON.stringify(gymData));
        }
        
        // ==================== UTILITIES ====================
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = Math.floor((now - date) / (1000 * 60 * 60 * 24));
            
            if(diff === 0) return 'اليوم';
            if(diff === 1) return 'أمس';
            if(diff < 7) return `${diff} أيام`;
            if(diff < 30) return `${Math.floor(diff/7)} أسابيع`;
            return `${Math.floor(diff/30)} أشهر`;
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // Close modal on outside click
        document.getElementById('editModal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
    </script>
</body>
</html>
