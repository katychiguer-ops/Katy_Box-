<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kickboxing Memory</title>
    
    <!-- App Icon -->
    <link rel="icon" type="image/png" href="AED5A342-A9AB-4969-88BA-3C9E7AF7949F.png">
    <link rel="apple-touch-icon" href="AED5A342-A9AB-4969-88BA-3C9E7AF7949F.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary: #6d4aff;
            --primary-light: #a38bff;
            --accent: #ff6b9d;
            --accent-light: #ffb6c9;
            --background: #faf5ff;
            --surface: #ffffff;
            --text-primary: #2d2d44;
            --text-secondary: #6b6b8a;
            --success: #00d285;
            --warning: #ffc857;
            --danger: #ff477e;
            --shadow: rgba(109, 74, 255, 0.15);
            --card-shadow: 0 8px 24px var(--shadow);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #efe5ff 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
            border-radius: 0 0 30px 30px;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        /* Navigation */
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 12px 8px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            border-radius: 12px;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-light) 100%);
            color: var(--primary);
            font-weight: bold;
        }
        
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }
        
        /* Sections */
        section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }
        
        section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }
        
        .card {
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 16px;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-light);
        }
        
        .card.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--surface) 100%);
        }
        
        .card svg {
            width: 100%;
            height: 120px;
            margin-bottom: 12px;
        }
        
        .card h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .card .badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }
        
        /* Buttons */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            box-shadow: 0 4px 16px var(--shadow);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary-light);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        /* Form Elements */
        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0eb;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--shadow);
        }
        
        /* Animation Preview */
        .animation-preview {
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 16px 0;
            box-shadow: var(--card-shadow);
            text-align: center;
        }
        
        .animation-stage {
            width: 200px;
            height: 200px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #f5f0ff 0%, #ede5ff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .speed-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        
        .speed-btn {
            padding: 8px 16px;
            border: 2px solid var(--primary-light);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .speed-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Tracking */
        .progress-bar {
            height: 8px;
            background: #e0e0eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            transition: width 0.5s ease;
        }
        
        .rating {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        
        .rating-option {
            padding: 8px 16px;
            border: 2px solid #e0e0eb;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        
        .rating-option.selected {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        
        /* Schedule */
        .schedule-row {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .checkbox-custom {
            width: 28px;
            height: 28px;
            border: 2px solid #e0e0eb;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .checkbox-custom.checked {
            background: var(--success);
            border-color: var(--success);
        }
        
        .payment-month {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .payment-month.paid {
            background: #e8fff5;
            border-left: 4px solid var(--success);
        }
        
        .payment-toggle {
            width: 52px;
            height: 28px;
            background: #e0e0eb;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .payment-toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            right: 2px;
            transition: var(--transition);
        }
        
        .payment-toggle.active {
            background: var(--success);
        }
        
        .payment-toggle.active::after {
            right: 26px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* Category Filter */
        .category-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .category-btn {
            padding: 8px 16px;
            border: none;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        
        .category-btn.active {
            background: var(--primary);
            color: white;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 16px 28px;
            border-radius: 12px;
            opacity: 0;
            transition: var(--transition);
            z-index: 3000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        /* Series Builder Selection */
        .move-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        
        .selector-card {
            background: var(--surface);
            border: 2px solid #e0e0eb;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        
        .selector-card:hover {
            border-color: var(--primary-light);
        }
        
        .selector-card.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--surface) 100%);
        }
        
        .selector-card .add-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: var(--transition);
        }
        
        .selector-card.selected .add-btn {
            background: var(--success);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🥊 ذاكرة الملاكمة</h1>
            <p>حفظ ما تتعلمين في الصالة</p>
        </header>
        
        <!-- Section 1: Cards -->
        <section id="cards-section" class="active">
            <div class="category-filter" id="categoryFilter"></div>
            
            <h2 style="margin-bottom: 16px;">بطاقات الحركات</h2>
            <div class="grid" id="cardsGrid"></div>
        </section>
        
        <!-- Section 2: Series Builder -->
        <section id="series-section">
            <h2 style="margin-bottom: 16px;">صناعة السلسلة</h2>
            
            <div class="card" style="margin-bottom: 16px;">
                <input type="text" id="seriesName" placeholder="اسم السلسلة (مثلاً: حصة الأربعاء)">
                <p style="font-size: 0.85rem; color: var(--text-secondary);">
                    اضغطي + على البطاقات لإضافة الحركات للسلسلة
                </p>
            </div>
            
            <h3 style="margin: 16px 0;">الحركات المضافة:</h3>
            <div id="selectedMoves" class="grid" style="margin-bottom: 16px;"></div>
            
            <div class="move-selector" id="moveSelector"></div>
            
            <button class="btn btn-primary" onclick="previewSeries()" style="width: 100%; margin: 16px 0;">
                ▶️ معاينة السلسلة
            </button>
            
            <div class="animation-preview" id="seriesPreview" style="display: none;">
                <h3 style="margin-bottom: 12px;">معاينة متحركة</h3>
                <div class="animation-stage" id="animationStage">
                    <!-- SVG will be inserted here -->
                </div>
                <div class="speed-controls">
                    <button class="speed-btn" onclick="setSpeed(0.5)">🐢 بطيء</button>
                    <button class="speed-btn active" onclick="setSpeed(1)">▶️ عادي</button>
                    <button class="speed-btn" onclick="setSpeed(1.5)">⚡ سريع</button>
                    <button class="speed-btn" onclick="toggleAnimation()">◼️ إيقاف</button>
                </div>
            </div>
            
            <button class="btn btn-success" onclick="saveSeries()" style="width: 100%;" id="saveSeriesBtn">
                💾 حفظ السلسلة
            </button>
            
            <h2 style="margin-top: 32px; margin-bottom: 16px;">السلاسل المحفوظة</h2>
            <div id="savedSeriesList"></div>
        </section>
        
        <!-- Section 3: Dictionary -->
        <section id="dictionary-section">
            <h2 style="margin-bottom: 16px;">المعجم</h2>
            <input type="text" id="searchDict" placeholder="ابحث عن حركة..." onkeyup="filterDictionary()">
            <div class="grid" id="dictionaryGrid"></div>
        </section>
        
        <!-- Section 4: Tracking -->
        <section id="tracking-section">
            <h2 style="margin-bottom: 16px;">تتبع التطور</h2>
            <div id="trackingList"></div>
        </section>
        
        <!-- Section 5: Gym Schedule -->
        <section id="schedule-section">
            <h2 style="margin-bottom: 16px;">حصص الصالة</h2>
            <div id="gymSchedule"></div>
            
            <h2 style="margin-top: 32px; margin-bottom: 16px;">الدفع</h2>
            <div class="card" style="margin-bottom: 16px;">
                <label>بداية الاشتراك:</label>
                <input type="date" id="subscriptionStart" value="2026-09-15">
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px;">سيتم عرض الأشهر بالصيغة: 15/09/2026</p>
            </div>
            <div id="paymentTracker"></div>
        </section>
        
        <!-- Edit Modal -->
        <div class="modal" id="editModal">
            <div class="modal-content">
                <h2 style="margin-bottom: 16px;">تعديل الاسم</h2>
                <p id="editMovementName" style="margin-bottom: 16px; color: var(--text-secondary);"></p>
                <label>الاسم الذي يستخدمه مدربك:</label>
                <input type="text" id="customNameInput" placeholder="اكتبي الاسم هنا">
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="saveCustomName()" style="flex: 1;">حفظ</button>
                    <button class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">إلغاء</button>
                </div>
            </div>
        </div>
        
        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>
    
    <!-- Navigation -->
    <nav>
        <button class="nav-item active" onclick="showSection('cards')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <span>الحركات</span>
        </button>
        <button class="nav-item" onclick="showSection('series')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg>
            <span>السلاسل</span>
        </button>
        <button class="nav-item" onclick="showSection('dictionary')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
            <span>المعجم</span>
        </button>
        <button class="nav-item" onclick="showSection('tracking')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
            <span>التطور</span>
        </button>
        <button class="nav-item" onclick="showSection('schedule')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>الصالة</span>
        </button>
    </nav>
    
    <script>
        // ==================== MOVEMENT DATABASE - 200+ MOVES ====================
        const movementDB = [
            // ========== ضربات الأرجل (Leg Strikes) =========
            // ركلات أمامية
            {id: "front-kick-r-basic", arabic: "فرونت كيك أمامي باليمين", english: "Basic Front Kick Right", category: "ضربات الأرجل", level: "مبتدئ", visual: {type: "front-kick", side: "right", height: "basic"}},

            {id: "roundhouse-low-l", arabic: "راوند هوس منخفض باليسار", english: "Low Roundhouse Left", category: "ضربات الأرجل", level: "مبتدئ", visual: {type: "roundhouse-kick", side: "left", height: "low"}},

            {id: "roundhouse-mid-l", arabic: "راوند هوس متوسط باليسار", english: "Mid Roundhouse Left", category: "ضربات الأرجل", level: "مبتدئ", visual: {type: "roundhouse-kick", side: "left", height: "mid"}},
            {id: "roundhouse-high-r", arabic: "راوند هوس مرتفع باليمين", english: "High Roundhouse Right", category: "ضربات الأرجل", level: "متقدم", visual: {type: "roundhouse-kick", side: "right", height: "high"}},
            {id: "roundhouse-high-l", arabic: "راوند هوس مرتفع باليسار", english: "High Roundhouse Left", category: "ضربات الأرجل", level: "متقدم", visual: {type: "roundhouse-kick", side: "left", height: "high"}},
            {id: "roundhouse-crescent-r", arabic: "راوند هوس قمر باليمين", english: "Crescent Roundhouse Right", category: "ضربات الأرجل", level: "متقدم", visual: {type: "crescent-roundhouse", side: "right"}},
            {id: "roundhouse-crescent-l", arabic: "راوند هوس قمر باليسار", english: "Crescent Roundhouse Left", category: "ضربات الأرجل", level: "متقدم", visual: {type: "crescent-roundhouse", side: "left"}},
            
            // ركلات جانبية

            renderTracking();
            renderSchedule();
            renderPaymentTracker();
            
            // Set subscription start date
            const savedDate = localStorage.getItem('subscriptionStart');
            if(savedDate) {
                document.getElementById('subscriptionStart').value = savedDate;
            }

        // ==================== NAVIGATION ====================
        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`${sectionId}-section`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // Scroll to top
            window.scrollTo(0, 0);
        }
        
        // ==================== CATEGORY FILTER ====================
        function renderCategories() {
            const categories = ["all", "ضربات الأرجل", "ضربات البوكس", "ضربات اليد العادية", "ضربات الوجه", "حماية نفس", "انحناءات وهروب"];
            const filterDiv = document.getElementById('categoryFilter');
            
            let html = '';
            categories.forEach(cat => {
                html += `<button class="category-btn ${currentCategory === cat ? 'active' : ''}" onclick="filterByCategory('${cat}')">${cat === 'all' ? 'الكل' : cat}</button>`;
            });
            filterDiv.innerHTML = html;
        }
        
        function filterByCategory(category) {
            currentCategory = category;
            renderCategories();
            renderCards();
        }
        
        // ==================== CARD RENDERING ====================
        function renderCards() {
            const filtered = currentCategory === 'all' 
                ? movementDB 
                : movementDB.filter(m => m.category === currentCategory);
            
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = filtered.map((move, index) => `
                <div class="card" onclick="addToSeries('${move.id}')" style="cursor:pointer;">
                    ${renderSVG(move.visual, true, index)}
                    <h3>${move.arabic.trim()}</h3>
                    <p>${move.english}</p>
                    <span class="badge">${move.level}</span>
                </div>
            `).join('');
        }
        
        // ==================== MOVE SELECTOR FOR SERIES ====================
        function renderMoveSelector() {
            const container = document.getElementById('moveSelector');
            // Show only first 20 moves for selector performance
            const movesToShow = movementDB.slice(0, 20);
            
            container.innerHTML = movesToShow.map(move => {
                const isSelected = selectedMoves.some(m => m.id === move.id);
                return `
                    <div class="selector-card ${isSelected ? 'selected' : ''}" onclick="toggleMoveSelection('${move.id}')">
                        <div class="add-btn">${isSelected ? '✓' : '+'}</div>
                        ${renderSVG(move.visual, false, movementDB.indexOf(move))}
                        <h4 style="font-size:0.8rem;">${move.arabic.trim().substring(0, 20)}...</h4>
                        <span class="badge" style="font-size:0.65rem;">${move.level}</span>
                    </div>
                `;
            }).join('');
        }
        
        function toggleMoveSelection(moveId) {
            const move = movementDB.find(m => m.id === moveId);
            if(!move) return;
            
            const index = selectedMoves.findIndex(m => m.id === moveId);
            if(index > -1) {
                selectedMoves.splice(index, 1);
            } else {
                if(selectedMoves.length >= 8) {
                    showToast('⚠️ الحد الأقصى 8 حركات في السلسلة');
                    return;
                }
                selectedMoves.push(move);
            }
            
            renderSelectedMoves();
            renderMoveSelector();
            showToast(selectedMoves.some(m => m.id === moveId) ? '➕ تمت الإضافة' : '➖ تم الإزالة');
        }
